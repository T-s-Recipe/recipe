spring:
  webflux:
    base-path: /recipes
  application:
    name: recipe
  data:
    mongodb:
      uri: ${MONGO_URL}
    redis:
      repositories:
        enabled: false

server:
  port: 8030

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

external-service-url:
  member: "http://member"

resilience4j:
  circuitbreaker:
    instances:
      member-service:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - shop.tsrecipe.recipe.exception.BaseException